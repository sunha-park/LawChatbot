<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>OTP 인증</title>
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <img src="/static/logo.png" alt="Logo" class="logo">
        </div>
        <form action="{{ url_for('verify_otp', email=request.view_args['email']) }}" method="post">
            <div class="form-group">
                <input type="text" id="otp" name="otp" placeholder = "OTP 6자리를 입력해주세요." required>
            </div>
            <div class="form-group">
                <button type="submit">인증하기</button>
            </div>
        </form>
        
    </div>
</body>
</html>
